name: Cloud Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "cloud-infrastructure/**"
      - ".github/workflows/cloud-infrastructure.yml"
      - "!**.md"
  pull_request:
    paths:
      - "cloud-infrastructure/**"
      - ".github/workflows/cloud-infrastructure.yml"
      - "!**.md"
  workflow_dispatch:

concurrency:
  group: cloud-infrastructure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Terraform at the version mise.toml pins.
      - name: Install Terraform
        uses: jdx/mise-action@v5
        with:
          install_args: terraform

      - name: Check Formatting
        run: terraform fmt -check -recursive cloud-infrastructure/scaleway

      # Without a backend the modules validate against the providers alone: no state and no Scaleway credentials.
      - name: Validate Modules
        run: |
          for module in bootstrap environment; do
            terraform -chdir=cloud-infrastructure/scaleway/$module init -backend=false -input=false
            terraform -chdir=cloud-infrastructure/scaleway/$module validate
          done

  # Deployment placeholder. The upstream deployment jobs targeted Azure (Bicep) and are removed. The infrastructure
  # deploys to Scaleway through the developer CLI's `bootstrap` and `deploy` commands until `aspire deploy` can deploy
  # the infrastructure itself (#12); its jobs belong here.
