name: App Gateway

on:
  push:
    branches:
      - main
    paths:
      - "application/*"
      - "application/shared-kernel/**"
      - "application/AppGateway/**"
      - "application/AppGateway.Tests/**"
      - ".github/workflows/app-gateway.yml"
      - "!**.md"
  pull_request:
    paths:
      - "application/*"
      - "application/shared-kernel/**"
      - "application/AppGateway/**"
      - "application/AppGateway.Tests/**"
      - ".github/workflows/app-gateway.yml"
      - "!**.md"
  workflow_dispatch:

concurrency:
  group: app-gateway-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: application/global.json

      - name: Restore .NET Tools
        working-directory: application
        run: dotnet tool restore

      - name: Restore .NET Dependencies
        working-directory: application
        run: dotnet restore AppGateway.Tests/AppGateway.Tests.csproj

      - name: Generate and Set User Secret for Token Signing Key
        working-directory: application/shared-kernel/SharedKernel
        run: |
          # The tests sign authentication tokens; a throwaway key is enough, and none is committed.
          USER_SECRETS_ID=$(grep -oP '(?<=<UserSecretsId>).*?(?=</UserSecretsId>)' SharedKernel.csproj)
          dotnet user-secrets set "authentication-token-signing-key" "$(openssl rand -base64 64)" --id $USER_SECRETS_ID

      - name: Run Tests
        working-directory: application
        run: |
          dotnet build AppGateway.Tests/AppGateway.Tests.csproj --no-restore &&
          dotnet test AppGateway.Tests/AppGateway.Tests.csproj --no-build

  # Deployment placeholder. The upstream deployment jobs targeted Azure and are removed. The app-gateway deploys to
  # Scaleway with the rest of the environment through the developer CLI's `deploy` command until `aspire deploy` can
  # deploy infrastructure and each system on its own (#12); its jobs belong here.
