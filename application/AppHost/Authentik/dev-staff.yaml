# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Development staff for the local authentik harness (never deployed). Sign in with the email
# address; the one-time code arrives in Mailpit. No passwords exist.
version: 1
metadata:
  name: EuropeanPlatform staff (development)
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: EuropeanPlatform staff identity
      required: true
  - model: authentik_core.user
    identifiers:
      username: dev-admin
    attrs:
      name: Dev Admin
      email: dev-admin@dev.localhost
      type: internal
      is_active: true
      groups:
        - !Find [authentik_core.group, [name, staff]]
        - !Find [authentik_core.group, [name, admins]]
  - model: authentik_core.user
    identifiers:
      username: dev-staff
    attrs:
      name: Dev Staff
      email: dev-staff@dev.localhost
      type: internal
      is_active: true
      groups:
        - !Find [authentik_core.group, [name, staff]]
