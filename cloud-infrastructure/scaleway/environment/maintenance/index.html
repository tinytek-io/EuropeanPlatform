<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>We'll be right back</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #1f2933; display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; }
  .card { max-width: 28rem; padding: 2.5rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { color: #52606d; line-height: 1.6; margin: 0; }
  .dot { width: 0.75rem; height: 0.75rem; border-radius: 9999px; background: #f0b429; display: inline-block; margin-bottom: 1.5rem; }
</style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>We'll be right back</h1>
    <p>This environment is temporarily unavailable — most likely for a deployment or maintenance. Please try again in a few minutes.</p>
  </div>
</body>
</html>
