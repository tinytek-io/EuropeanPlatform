# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# The staff identity provider (authentik >= 2026.8.2): the groups the back-office authorizes on,
# the passwordless sign-in flow, optional passkeys, and the back-office OIDC client. Shared by every
# environment (local dev harness, staging, production); per-environment values arrive through
# environment variables on the authentik WORKER, which resolves the !Env tags:
#   EP_BACK_OFFICE_REDIRECT_URI     the back-office OIDC callback URL
#   BACK_OFFICE_OIDC_CLIENT_SECRET  the back-office client secret (Secret Manager in deployed environments)
# The staff themselves live in a separate per-environment blueprint (cloud-infrastructure/authentik/staff/).
#
# Sign-in never involves a password: staff identify by email and confirm with a one-time code sent to
# that address (the email device is set up automatically on first sign-in from the address in the staff
# blueprint), or with a passkey they added themselves. Passkeys are stored in authentik's database only.
version: 1
metadata:
  name: EuropeanPlatform staff identity
entries:
  # --- authentik's bundled blueprints that create objects this one looks up (!Find). On a fresh
  # database every blueprint is discovered at once in no guaranteed order, so without these this one
  # can fail on first boot and stay failed until the next periodic reapply.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true

  # --- Groups: `staff` may sign in to the back-office, `admins` additionally unlocks admin actions
  # (BackOffice:Oidc:StaffGroupId and BackOffice:AdminsGroupId).
  - model: authentik_core.group
    id: staff
    identifiers:
      name: staff
  - model: authentik_core.group
    id: admins
    identifiers:
      name: admins

  # --- Optional passkeys: a self-service setup flow reachable from the user settings, never forced.
  - model: authentik_flows.flow
    id: passkey-setup-flow
    identifiers:
      slug: ep-staff-passkey-setup
    attrs:
      name: Add a passkey
      title: Add a passkey
      designation: stage_configuration
      authentication: require_authenticated
  - model: authentik_stages_authenticator_webauthn.authenticatorwebauthnstage
    id: passkey-setup
    identifiers:
      name: ep-staff-passkey-setup
    attrs:
      friendly_name: Passkey
      configure_flow: !KeyOf passkey-setup-flow
      resident_key_requirement: required
      user_verification: required
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf passkey-setup-flow
      stage: !KeyOf passkey-setup
      order: 0

  # --- One-time code by email. Ten-minute codes; wrong codes back off exponentially (ThrottlingMixin).
  - model: authentik_stages_authenticator_email.authenticatoremailstage
    id: email-code
    identifiers:
      name: ep-staff-email-code
    attrs:
      friendly_name: Email code
      use_global_settings: true
      token_expiry: minutes=10
      subject: Your sign-in code

  # --- The sign-in flow: email (or passkey autofill) -> email code or passkey -> signed in.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: validate
    identifiers:
      name: ep-staff-validate
    attrs:
      device_classes:
        - email
        - webauthn
      # A staff member without a device yet gets the email device set up from their address.
      not_configured_action: configure
      configuration_stages:
        - !KeyOf email-code
      webauthn_user_verification: required
  - model: authentik_stages_identification.identificationstage
    id: identification
    identifiers:
      name: ep-staff-identification
    attrs:
      user_fields:
        - email
      # Unknown addresses get the same response as known ones (no account enumeration).
      pretend_user_exists: true
      show_matched_user: false
      # Passkey autofill on the email field signs in without a code.
      webauthn_stage: !KeyOf validate
  - model: authentik_stages_user_login.userloginstage
    id: user-login
    identifiers:
      name: ep-staff-user-login
    attrs:
      session_duration: hours=8
  - model: authentik_flows.flow
    id: sign-in-flow
    identifiers:
      slug: ep-staff-sign-in
    attrs:
      name: Staff sign-in
      title: Sign in
      designation: authentication
      authentication: require_unauthenticated
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf sign-in-flow
      stage: !KeyOf identification
      order: 10
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf sign-in-flow
      stage: !KeyOf validate
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf sign-in-flow
      stage: !KeyOf user-login
      order: 30

  # The default brand signs in through the passwordless flow instead of the bundled password flow.
  # authentik's own "Default - Brand" blueprint creates that brand (with its logout and user settings
  # flows) only when no brand exists yet, so it must apply first; otherwise this entry would create a
  # bare brand and the bundled blueprint would then fail on the taken domain.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Brand
      required: true
  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
      default: true
    attrs:
      flow_authentication: !KeyOf sign-in-flow

  # --- The back-office OIDC client: code flow, RS256-signed tokens (verifiable against the JWKS), and
  # a `groups` scope carrying the group names the back-office gates on.
  - model: authentik_providers_oauth2.scopemapping
    id: groups-scope
    identifiers:
      name: EuropeanPlatform groups
    attrs:
      scope_name: groups
      description: Group membership
      expression: |
        return {"groups": [group.name for group in request.user.groups.all()]}
  - model: authentik_providers_oauth2.oauth2provider
    id: back-office-provider
    identifiers:
      name: back-office
    attrs:
      client_type: confidential
      client_id: back-office
      client_secret: !Env BACK_OFFICE_OIDC_CLIENT_SECRET
      # Providers allow no grant type unless listed. The back-office signs in with the code flow and
      # never requests offline_access, so it gets no refresh tokens.
      grant_types:
        - authorization_code
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: !Env EP_BACK_OFFICE_REDIRECT_URI
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf groups-scope
  - model: authentik_core.application
    id: back-office-application
    identifiers:
      slug: back-office
    attrs:
      name: Back-office
      provider: !KeyOf back-office-provider
      policy_engine_mode: any
  # Only staff may use the back-office application at all (the back-office re-checks the group).
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf back-office-application
      group: !KeyOf staff
      order: 0
